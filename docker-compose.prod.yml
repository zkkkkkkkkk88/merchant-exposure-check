name: merchant-exposure

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - production-db:/var/lib/postgresql/data

  migrate:
    build: ./services/api
    command: ["alembic", "upgrade", "head"]
    environment: &api-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ARK_API_KEY: ${ARK_API_KEY}
      ARK_MODEL: ${ARK_MODEL}
      AMAP_KEY: ${AMAP_KEY:-}
      TENCENT_MAP_KEY: ${TENCENT_MAP_KEY:-}
      ACCESS_AUTH_REQUIRED: "true"
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./services/api
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    build: ./services/api
    command: ["python", "-m", "app.scans.worker"]
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      ACCESS_AUTH_REQUIRED: "true"
      ACCESS_ADMIN_USERNAME: ${ACCESS_ADMIN_USERNAME}
      ACCESS_ADMIN_PASSWORD_HASH: ${ACCESS_ADMIN_PASSWORD_HASH}
      ACCESS_DEMO_USERNAME: ${ACCESS_DEMO_USERNAME}
      ACCESS_DEMO_PASSWORD_HASH: ${ACCESS_DEMO_PASSWORD_HASH}
      ACCESS_SESSION_SECRET: ${ACCESS_SESSION_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://gateway:80"]
    restart: unless-stopped
    depends_on:
      - gateway

volumes:
  production-db:
